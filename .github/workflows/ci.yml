name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        # No real secrets in CI — the app is written to degrade gracefully when
        # env vars are missing, so placeholder values are enough to prove the
        # build itself is sound. Do not put real keys in this workflow.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build

  backend-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend-python
        run: python -m pip install -e "backend-python[dev]"

      - name: Test
        # No RUN_SUPABASE_INTEGRATION_TESTS / SUPABASE_INTEGRATION_* env vars are
        # set here, so the networked RLS integration test self-skips. Do not add
        # Supabase or other production secrets to this job.
        run: python -m pytest backend-python/tests

      - name: Ruff
        run: python -m ruff check backend-python/app backend-python/tests
